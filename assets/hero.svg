<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Abdessalem Saadaoui — Functional Analyst and Full-Stack Developer. Business need becomes business rule, API contract, Spring Boot service, passing test.">
  <title>Abdessalem Saadaoui — from business need to passing test</title>

  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0F766E" stop-opacity="0"/>
      <stop offset=".18" stop-color="#0F766E" stop-opacity="1"/>
      <stop offset=".82" stop-color="#5EEAD4" stop-opacity="1"/>
      <stop offset="1"   stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#14B8A6" stop-opacity=".18"/>
      <stop offset=".5"  stop-color="#14B8A6" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#14B8A6" stop-opacity=".18"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="wire" d="M 96 214 H 784"/>
  </defs>

  <!-- name -->
  <text x="440" y="70" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="600"
        fill="#14B8A6" letter-spacing="0.5">
    Abdessalem Saadaoui
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- title -->
  <text x="440" y="104" text-anchor="middle"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14"
        fill="#7f9996" letter-spacing="3.4">
    FUNCTIONAL ANALYST &#183; FULL-STACK DEVELOPER &#183; BRUSSELS
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.35;1" dur="1.7s" fill="freeze"/>
  </text>

  <!-- animated rule under the title -->
  <rect x="240" y="126" width="400" height="2" fill="url(#rule)">
    <animate attributeName="width" values="0;400" dur="1.4s" fill="freeze"/>
    <animate attributeName="x" values="440;240" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- section caption -->
  <text x="440" y="168" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic"
        fill="#94aeab">
    the same project, specified and built
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;.55;1" dur="2.4s" fill="freeze"/>
  </text>

  <!-- pipeline wire -->
  <line x1="96" y1="214" x2="784" y2="214" stroke="url(#track)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x2" values="96;784" dur="1.8s" begin=".6s" fill="freeze"/>
  </line>

  <!-- travelling pulse -->
  <circle r="5.5" fill="#5EEAD4" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".4s" begin="2.4s" fill="freeze"/>
    <animateMotion dur="7s" begin="2.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#wire"/>
    </animateMotion>
  </circle>

  <!-- ── stages ───────────────────────────────────────────────── -->
  <!-- node 1 -->
  <g>
    <circle cx="96" cy="214" r="7" fill="none" stroke="#14B8A6" stroke-width="2.5">
      <animate attributeName="r" values="7;12;7;7;7;7;7" keyTimes="0;.03;.09;.3;.6;.85;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="none;#14B8A6;none;none" keyTimes="0;.04;.1;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="96" y="252" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#7f9996">business need</text>
  </g>
  <!-- node 2 -->
  <g>
    <circle cx="268" cy="214" r="7" fill="none" stroke="#14B8A6" stroke-width="2.5">
      <animate attributeName="r" values="7;7;12;7;7;7;7" keyTimes="0;.22;.25;.31;.6;.85;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="none;none;#14B8A6;none;none" keyTimes="0;.23;.26;.32;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="268" y="252" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#7f9996">BR-001</text>
  </g>
  <!-- node 3 -->
  <g>
    <circle cx="440" cy="214" r="7" fill="none" stroke="#14B8A6" stroke-width="2.5">
      <animate attributeName="r" values="7;7;12;7;7;7" keyTimes="0;.47;.5;.56;.85;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="none;none;#14B8A6;none;none" keyTimes="0;.48;.51;.57;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="440" y="252" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#7f9996">API contract</text>
  </g>
  <!-- node 4 -->
  <g>
    <circle cx="612" cy="214" r="7" fill="none" stroke="#14B8A6" stroke-width="2.5">
      <animate attributeName="r" values="7;7;12;7;7" keyTimes="0;.72;.75;.81;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="none;none;#14B8A6;none;none" keyTimes="0;.73;.76;.82;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="612" y="252" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#7f9996">Spring Boot</text>
  </g>
  <!-- node 5 — the test, settles green -->
  <g>
    <circle cx="784" cy="214" r="7" fill="none" stroke="#14B8A6" stroke-width="2.5">
      <animate attributeName="r" values="7;7;13;9;9" keyTimes="0;.96;.985;1;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#14B8A6;#14B8A6;#4ADE80;#4ADE80" keyTimes="0;.96;.99;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="none;none;#4ADE80;#4ADE80" keyTimes="0;.96;.99;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="784" y="252" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#7f9996">test passes</text>
    <!-- tick -->
    <path d="M 779 214 l 3.4 3.6 l 6.2 -7" fill="none" stroke="#0a1211" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.97;.995;1" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
