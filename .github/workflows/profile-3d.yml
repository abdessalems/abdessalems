# Renders the contribution calendar as an isometric 3D SVG into ./profile-3d-contrib/
# and commits it back to main. The README references it by relative path.

name: GitHub profile 3D contribution calendar

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate the 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name  "SAADAOUI ABDESSALEM"
          git config user.email "107399601+abdessalems@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: refresh the 3D contribution calendar"
          git push
