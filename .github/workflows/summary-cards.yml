# Generates summary cards into the `profile-summary-cards-output` branch.
# The "most commit language" card counts COMMITS per language rather than
# committed bytes, so template CSS and images cannot distort it.

name: GitHub profile summary cards

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate the cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-cards-output
          UTC_OFFSET: 2
